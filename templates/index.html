<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Monitor</title>
<style>
:root{
  --bg:#e9eef0; --panel:#fff; --ink:#14282e; --muted:#5d7178; --line:#cfd9dc;
  --accent:#0b6e75; --accent-ink:#fff; --ok:#1f7a4d; --warn:#b4580a; --bad:#a3262a;
  --warn-bg:#fbeedd; --bad-bg:#f8e1e1;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1b1f;--panel:#17262b;--ink:#e3eef0;--muted:#8fa6ad;--line:#2a3d44;
  --accent:#4fc1c9;--accent-ink:#06262a;--ok:#5fd193;--warn:#f0a35a;--bad:#f27b7e;
  --warn-bg:#3a2a17;--bad-bg:#3b1d1f}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 .75rem}
.muted{color:var(--muted);margin:.15rem 0 0;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:1.1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line);background:var(--panel)}
.top-right{display:flex;gap:.6rem;align-items:center}
main{padding:clamp(1rem,3vw,2rem) clamp(1rem,4vw,2.5rem);display:grid;gap:1.25rem;max-width:1400px;margin:0 auto}
.pill{padding:.25rem .7rem;border-radius:99px;font-size:.82rem;font-weight:600;border:1px solid var(--line)}
.pill.on{background:var(--ok);color:#fff;border-color:transparent}
.pill.off{background:var(--bad);color:#fff;border-color:transparent}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.node{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:6px;padding:1rem}
.node.offline{border-left-color:var(--muted);opacity:.85}
.node.alert{border-left-color:var(--bad)}
.node-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.node-head h3{margin:0;font-size:1.05rem}
.state{font-size:.8rem;font-weight:600;color:var(--ok)}
.offline .state{color:var(--muted)}.alert .state{color:var(--bad)}
.sub{color:var(--muted);font-size:.8rem;margin-bottom:.7rem}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .8rem;margin:0 0 .9rem}
.readings div{min-width:0}
.readings dt{font-size:.78rem;color:var(--muted)}
.readings dd{margin:0;font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.readings dd small{font-size:.75rem;font-weight:400;color:var(--muted);margin-left:2px}
.readings dd.bad{color:var(--bad)}
.cmds{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{font:inherit;font-size:.85rem;padding:.4rem .8rem;border-radius:5px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);cursor:pointer}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1rem;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:.5rem}
.panel-head h2{margin:0}
.controls{display:flex;gap:1rem;flex-wrap:wrap}
label{font-size:.85rem;color:var(--muted)}
select{font:inherit;margin-left:.3rem;padding:.25rem .4rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
canvas{width:100%;display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:1.25rem}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;max-height:320px;overflow:auto}
.alerts li{padding:.5rem .7rem;border-radius:5px;background:var(--bad-bg);font-size:.88rem}
.alerts li.muted{background:none;padding:0}
.alerts time{display:block;font-size:.75rem;color:var(--muted)}
.table-wrap{overflow:auto;max-height:320px}
table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:.4rem .6rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);
  padding:.6rem 1rem;border-radius:6px;transition:transform .2s;font-size:.9rem}
.toast.show{transform:translate(-50%,0)}
@media(max-width:800px){.split{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Building Monitor</h1>
    <p id="meta" class="muted">Connecting to server…</p>
  </div>
  <div class="top-right">
    <span id="serverState" class="pill">Connecting</span>
  </div>
</header>

<main>
  <section aria-label="Nodes">
    <div id="nodes" class="nodes"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Trends</h2>
      <div class="controls">
        <label>Node <select id="chartNode"></select></label>
        <label>Reading <select id="chartMetric"></select></label>
      </div>
    </div>
    <canvas id="chart" height="240" aria-label="Trend chart"></canvas>
  </section>

  <div class="split">
    <section class="panel">
      <h2>Alerts</h2>
      <ul id="alerts" class="alerts"><li class="muted">No alerts so far.</li></ul>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>History</h2>
        <button id="csvBtn" class="btn">Download CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="histHead"></thead>
          <tbody id="histBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<div id="toast" class="toast" role="status"></div>
<script>
// ===== Configuration: edit names, commands and alert limits =====
const CONFIG = {
  refreshMs: 5000,
  historyLimit: 60,
  nodes: {
    NODE_01: { name: 'Entrance',  cmds: [['led_on','LED on'],['led_off','LED off']] },
    NODE_02: { name: 'Classroom', cmds: [['buzzer_on','Buzzer on'],['buzzer_off','Buzzer off']] }
  },
  // key: [label, unit, alert-above value or null]
  metrics: {
    temperature: ['Temperature','°C',35],
    humidity:    ['Humidity','%',85],
    light:       ['Light','%',null],
    motion:      ['Motion','',null],
    door:        ['Door','',null],
    rssi:        ['Signal','dBm',null]
  }
};

const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
let nodes = [], serverUp = false, alertLog = [], lastAlertKey = {}, currentRows = [];

// ===== Data layer =====
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}

async function loadNodes() {
  try { nodes = await api('/api/nodes'); serverUp = true; }
  catch (e) { serverUp = false; }
}

async function loadHistory(id) {
  try { return await api('/api/history?node=' + id + '&limit=' + CONFIG.historyLimit); }
  catch (e) { return []; }
}

async function sendCommand(id, command) {
  try {
    await api('/api/commands/set', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ node_id: id, command }) });
    toast(CONFIG.nodes[id].name + ': ' + command.replace('_', ' ') + ' sent');
  } catch (e) { toast('Could not send command. Check the server connection.'); }
}

// ===== Rendering =====
function fmt(k, v) {
  if (typeof v === 'boolean') return v ? 'Detected' : 'None';
  return typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : v;
}
function exceeded(k, v) {
  const t = CONFIG.metrics[k] && CONFIG.metrics[k][2];
  return t != null && typeof v === 'number' && v > t;
}

function renderNodes() {
  const wrap = $('nodes');
  wrap.innerHTML = '';
  nodes.forEach(n => {
    const cfg = CONFIG.nodes[n.node_id] || { name: n.node_name, cmds: [] };
    const bad = Object.entries(n.readings).filter(([k, v]) => exceeded(k, v));
    const el = document.createElement('article');
    el.className = 'node' + (!n.online ? ' offline' : bad.length ? ' alert' : '');
    const rows = Object.entries(n.readings)
      .filter(([k]) => CONFIG.metrics[k] && k !== 'rssi')
      .map(([k, v]) => `<div><dt>${escapeHtml(CONFIG.metrics[k][0])}</dt><dd class="${exceeded(k, v) ? 'bad' : ''}">${escapeHtml(fmt(k, v))}<small>${typeof v === 'number' ? escapeHtml(CONFIG.metrics[k][1]) : ''}</small></dd></div>`).join('');
    el.innerHTML = `<div class="node-head"><h3>${escapeHtml(cfg.name)}</h3>
      <span class="state">${!n.online ? 'Offline' : bad.length ? 'Alert' : 'Online'}</span></div>
      <div class="sub">${escapeHtml(n.node_id)} · ${escapeHtml(n.online ? 'Signal ' + (n.readings.rssi ?? '–') + ' dBm' : 'Last seen ' + (n.last_seen || 'never').replace('T', ' '))}</div>
      <dl class="readings">${rows || '<div class="muted">No data yet</div>'}</dl><div class="cmds"></div>`;
    cfg.cmds.forEach(([cmd, label]) => {
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = label; b.disabled = !n.online;
      b.onclick = () => sendCommand(n.node_id, cmd);
      el.querySelector('.cmds').appendChild(b);
    });
    wrap.appendChild(el);
  });
}

function trackAlerts() {
  nodes.forEach(n => {
    const name = (CONFIG.nodes[n.node_id] || {}).name || n.node_id;
    const issues = [];
    if (!n.online && n.last_seen) issues.push(['offline', name + ' went offline']);
    Object.entries(n.readings).forEach(([k, v]) => {
      if (exceeded(k, v)) issues.push([k, `${name}: ${CONFIG.metrics[k][0].toLowerCase()} is ${fmt(k, v)} ${CONFIG.metrics[k][1]}, above ${CONFIG.metrics[k][2]}`]);
    });
    const keys = issues.map(i => i[0]).join();
    if (keys && lastAlertKey[n.node_id] !== keys) {
      issues.forEach(i => alertLog.unshift({ time: new Date().toLocaleTimeString(), text: i[1] }));
    }
    lastAlertKey[n.node_id] = keys;
  });
  alertLog = alertLog.slice(0, 30);
  $('alerts').innerHTML = alertLog.length
    ? alertLog.map(a => `<li>${escapeHtml(a.text)}<time>${escapeHtml(a.time)}</time></li>`).join('')
    : '<li class="muted">No alerts so far.</li>';
}

// ===== Chart (plain canvas, no libraries, works offline on the ESP32) =====
function drawChart(rows, metric) {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, c.clientWidth), h = 240;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); if (!g) return; g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue('--accent'), grid = css.getPropertyValue('--line'),
        txt = css.getPropertyValue('--muted'), bad = css.getPropertyValue('--bad');
  g.clearRect(0, 0, w, h);
  if (!metric || !CONFIG.metrics[metric]) { g?.clearRect(0, 0, w, h); return; }
  const pts = rows.filter(r => r[metric] !== undefined && r[metric] !== null && r[metric] !== '').map(r => Number(r[metric])).filter(Number.isFinite);
  g.font = '12px system-ui'; g.fillStyle = txt;
  if (pts.length < 2) { g.fillText('Waiting for more readings…', 12, 24); return; }
  const thr = CONFIG.metrics[metric][2];
  let lo = Math.min(...pts), hi = Math.max(...pts);
  if (thr != null) hi = Math.max(hi, thr);
  const pad = (hi - lo || 1) * .15; lo -= pad; hi += pad;
  const L = 44, R = 10, T = 10, B = 22;
  const X = i => L + i * (w - L - R) / (pts.length - 1);
  const Y = v => T + (hi - v) * (h - T - B) / (hi - lo);
  g.strokeStyle = grid; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    g.fillText(v.toFixed(1), 4, y + 4);
  }
  if (thr != null) {
    g.strokeStyle = bad; g.setLineDash([5, 4]);
    g.beginPath(); g.moveTo(L, Y(thr)); g.lineTo(w - R, Y(thr)); g.stroke(); g.setLineDash([]);
    g.fillStyle = bad; g.fillText('limit ' + thr, w - 70, Y(thr) - 4);
  }
  g.strokeStyle = line; g.lineWidth = 2; g.beginPath();
  pts.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.stroke();
  g.fillStyle = txt;
  const first = (rows[0].timestamp || '').slice(11, 19), last = (rows[rows.length - 1].timestamp || '').slice(11, 19);
  g.fillText(first, L, h - 6); g.fillText(last, w - R - 50, h - 6);
}

function renderHistory(rows) {
  const keys = ['timestamp', ...Object.keys(CONFIG.metrics).filter(k => rows.some(r => k in r))];
  $('histHead').innerHTML = '<tr>' + keys.map(k => `<th>${escapeHtml(k === 'timestamp' ? 'Time' : CONFIG.metrics[k][0])}</th>`).join('') + '</tr>';
  $('histBody').innerHTML = rows.slice(-25).reverse().map(r =>
    '<tr>' + keys.map(k => `<td>${escapeHtml(k === 'timestamp' ? (r[k] || '').replace('T', ' ') : r[k] === undefined ? '–' : fmt(k, r[k]))}</td>`).join('') + '</tr>').join('');
  return keys;
}

function downloadCsv(rows) {
  const keys = [...new Set(rows.flatMap(Object.keys))];
  const csv = [keys.join(','), ...rows.map(r => keys.map(k => r[k] ?? '').join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = $('chartNode').value + '_history.csv';
  a.click();
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2600);
}

// ===== Main loop =====
async function refresh() {
  await loadNodes();
  const up = nodes.filter(n => n.online).length;
  const s = $('serverState');
  s.textContent = serverUp ? 'Server online' : 'Server unreachable';
  s.className = 'pill ' + (serverUp ? 'on' : 'off');
  $('meta').textContent = serverUp
    ? `${up} of ${nodes.length} nodes online · refreshes every ${CONFIG.refreshMs / 1000} s · updated ${new Date().toLocaleTimeString()}`
    : 'Cannot reach the server. Retrying…';
  renderNodes(); trackAlerts();
  await refreshChart();
}

async function refreshChart() {
  const id = $('chartNode').value, metric = $('chartMetric').value;
  if (!id) { currentRows = []; renderHistory([]); return; }
  currentRows = await loadHistory(id);
  const have = Object.keys(CONFIG.metrics).filter(k => currentRows.some(r => k in r));
  const sel = $('chartMetric');
  if (sel.dataset.node !== id || !have.includes(sel.value)) {
    sel.innerHTML = have.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(CONFIG.metrics[k][0])}</option>`).join('');
    sel.dataset.node = id;
  }
  drawChart(currentRows, sel.value || have[0]);
  renderHistory(currentRows);
}

async function initDashboard() {
  await loadNodes();
  const choices = nodes.length ? nodes : Object.entries(CONFIG.nodes).map(([node_id, c]) => ({node_id, node_name:c.name}));
  $('chartNode').innerHTML = choices.map(n => `<option value="${escapeHtml(n.node_id)}">${escapeHtml(n.node_name)}</option>`).join('');
  await refresh();
}
$('chartNode').onchange = refreshChart;
$('chartMetric').onchange = refreshChart;
$('csvBtn').onclick = () => currentRows.length ? downloadCsv(currentRows) : toast('No readings to export yet.');
window.addEventListener('resize', () => refreshChart());
initDashboard();
setInterval(refresh, CONFIG.refreshMs);
</script>
</body>
</html>
